# tasks.yaml
# ─────────────────────────────────────────────────────────────────────────────
# CrewAI YAML Configuration — Task Definitions
#
# WHAT IS THIS FILE?
#   Defines WHAT each agent must do (the task), and WHAT output to expect.
#   Each task is linked to an agent defined in agents.yaml.
#
# KEY CONCEPTS:
#   description     : Instructions given to the agent (like a job brief)
#   expected_output : What the agent must return (used by the next agent)
#   agent           : Which agent (from agents.yaml) handles this task
#   context         : Which previous tasks this task depends on
#                     [SEARCH: CrewAI task context dependency]
# ─────────────────────────────────────────────────────────────────────────────

# ── Task 1: Fetch news sentiment ──────────────────────────────────────────────
task_daily_sentiment:
  description: >
    Use the fetch_news_sentiment tool to get the latest news headlines
    for {ticker}. Analyze the tone of the headlines and return a sentiment
    score between -1.0 and +1.0, along with a 1-sentence justification.
  expected_output: >
    A short report containing:
    - Sentiment Score: [number between -1.0 and 1.0]
    - Justification: [one sentence explaining why]
  agent: daily_data_agent

# ── Task 2: Fetch technical indicators ───────────────────────────────────────
task_perception:
  description: >
    Use the fetch_technical_indicators tool to retrieve the latest
    RSI(14) and MACD histogram for {ticker}. Report the exact numeric values.
  expected_output: >
    A plain-text report containing:
    - Ticker, Date, Price
    - RSI(14) value
    - MACD Histogram value
  agent: perception_agent

# ── Task 3: Run the Fuzzy Logic Controller ───────────────────────────────────
task_cognition:
  description: >
    Read the outputs from the Data Researcher (RSI, MACD histogram) and
    the News Analyst (sentiment score). Extract the exact numeric values.
    Call the run_fuzzy_analysis tool with those three numbers.
    sentiment should come from task_daily_sentiment output.
  expected_output: >
    The FLC result containing:
    - Score (1-5)
    - Signal label (Strong Buy / Buy / Hold / Sell / Strong Sell)
    - RSI linguistic state
    - MACD linguistic state
  agent: cognition_agent
  # context tells CrewAI: this task needs the outputs of task_perception
  # and task_daily_sentiment before it can start
  # [SEARCH: CrewAI task context sequential pipeline]
  context:
    - task_perception
    - task_daily_sentiment

# ── Task 4: Write the final recommendation ───────────────────────────────────
task_execution:
  description: >
    Based on the FLC score and signal from the Market Analyst, write a
    concise investment brief for {ticker}.
    Structure: (1) Action paragraph, (2) Technical Reasoning, (3) Risk Warning.
    Maximum 120 words total.
  expected_output: >
    A 3-paragraph investment brief (Action / Reasoning / Risk Warning),
    under 120 words, written for a retail investor.
  agent: execution_agent
  context:
    - task_perception
    - task_daily_sentiment
    - task_cognition
